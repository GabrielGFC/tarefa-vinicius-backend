services:
  mysql:
    image: mysql:8.0.43
    container_name: todo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: todo_root_password
      MYSQL_DATABASE: db-projeto-2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ptodo_root_password --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - todo_network

  api-express:
    build:
      context: ./api-express
      dockerfile: Dockerfile
    container_name: todo_api_express
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 3001
      DATABASE_URL: mysql://root:todo_root_password@mysql:3306/db-projeto-2026
      CORS_ORIGIN: http://localhost:5500
      JWT_SECRET: change-me-super-secret-jwt
      INTERNAL_TOKEN: change-me-internal-token
      LOG_SERVICE_URL: http://api-laravel:8000/internal/logs
      ANALYTICS_SERVICE_URL: http://api-fastapi:8001/internal/task-events
      AUTH_COOKIE_NAME: auth_token
      AUTH_TOKEN_TTL_SECONDS: 604800
      NODE_ENV: production
    ports:
      - "3001:3001"
    networks:
      - todo_network

  api-laravel:
    build:
      context: ./api-laravel
      dockerfile: Dockerfile
    container_name: todo_api_laravel
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_KEY: base64:2qgkGW4vV6kM6+b8Pz4M2mM2e8aN7EZvC3HhE6wmsVo=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: projeto-log-2026
      DB_USERNAME: root
      DB_PASSWORD: todo_root_password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      INTERNAL_TOKEN: change-me-internal-token
      CORS_ORIGIN: http://localhost:5500
    ports:
      - "8000:8000"
    networks:
      - todo_network

  api-fastapi:
    build:
      context: ./Api-fastapi
      dockerfile: Dockerfile
    container_name: todo_api_fastapi
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL_ANALYTICS: mysql+pymysql://root:todo_root_password@mysql:3306/projeto-analytics-2026
      PORT: 8001
      CORS_ORIGIN: http://localhost:5500
      JWT_SECRET: change-me-super-secret-jwt
      INTERNAL_TOKEN: change-me-internal-token
      AUTH_COOKIE_NAME: auth_token
    ports:
      - "8001:8001"
    networks:
      - todo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo_frontend
    restart: unless-stopped
    depends_on:
      - api-express
      - api-fastapi
    ports:
      - "5500:80"
    networks:
      - todo_network

volumes:
  mysql_data:

networks:
  todo_network:
    driver: bridge
