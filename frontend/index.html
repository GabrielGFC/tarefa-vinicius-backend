<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>To-Do List Microsserviços</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <h1>To-Do List Microsserviços</h1>
    <p id="statusMessage" class="status"></p>

    <div class="card">
        <h2>Nova Tarefa</h2>
        <form id="todoForm">
            <input type="text" id="title" placeholder="Título" required>
            <textarea id="description" placeholder="Descrição"></textarea>
            <button type="submit">Adicionar</button>
        </form>
    </div>

    <div class="card">
        <h2>Lista de Tarefas</h2>
        <ul id="todoList"></ul>
    </div>

    <div class="card">
        <h2>Estatísticas</h2>
        <p>Total: <span id="total">0</span></p>
        <p>Concluídas: <span id="completed">0</span></p>
        <p>Pendentes: <span id="pending">0</span></p>
    </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
